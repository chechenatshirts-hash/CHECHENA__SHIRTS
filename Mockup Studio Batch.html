<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mockup Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Almendra+Display&family=Audiowide&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Bruno+Ace&family=Bungee&family=Butcherman&family=Caesar+Dressing&family=Chakra+Petch:wght@400;700&family=Creepster&family=Diplomata&family=Eater&family=Ewert&family=Fascinate+Inline&family=Faster+One&family=Flavors&family=FrederickatheGreat&family=Frijole&family=Germania+One&family=Grenze+Gotisch:wght@400;700&family=Griffy&family=Henny+Penny&family=Inter:wght@300;400;600&family=Jolly+Lodger&family=Kanit:wght@400;900&family=Kirang+Haerang&family=Kranky&family=Londrina+Outline&family=Major+Mono+Display&family=MedievalSharp&family=Megrim&family=Metal&family=Metal+Mania&family=Miniver&family=Monoton&family=Montserrat&family=Mystery+Quest&family=New+Rocker&family=Nosifer&family=Orbitron&family=Oswald&family=Permanent+Marker&family=Piedra&family=Pirata+One&family=Plaster&family=Poppins&family=Raleway&family=Risque&family=Roboto&family=Rock+Salt&family=Rubik+Glitch&family=Rubik+Mono+One&family=Rye&family=Saira+Stencil+One&family=Sancreek&family=Seaweed+Script&family=Shojumaru&family=Silkscreen&family=Sirin+Stencil&family=Snowburst+One&family=Special+Elite&family=Stalemate&family=Stardos+Stencil&family=Syne:wght@400;800&family=Texturina:opsz,wght@12..72,400;12..72,900&family=Trade+Winds&family=UnifrakturCook:wght@700&family=UnifrakturMaguntia&family=Vast+Shadow&family=Wallpoet&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fontfaceobserver/2.3.0/fontfaceobserver.standalone.js"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --cream:        #FAF7F2;
      --ivory:        #F5F0E8;
      --linen:        #EDE8DF;
      --sand:         #E0D8CC;
      --champagne:    #D4C9B0;
      --warm-stone:   #C5B99A;
      --blush:        #EDD5C5;
      --dusty-rose:   #D9BDB0;
      --sage-light:   #D8E0D4;

      --text-primary:   #3A3228;
      --text-secondary: #6B5F52;
      --text-muted:     #9A8E82;

      --accent-warm:  #B8977E;
      --accent-gold:  #C9A96E;
      --accent-sage:  #8A9E84;
      --accent-rose:  #C4938A;

      --border:       rgba(180,165,145,0.30);
      --border-mid:   rgba(180,165,145,0.50);
      --shadow-xs:    0 1px 3px rgba(80,60,40,0.06);
      --shadow-sm:    0 4px 12px rgba(80,60,40,0.08);
      --shadow-md:    0 8px 28px rgba(80,60,40,0.11);
      --shadow-canvas:0 28px 72px rgba(80,60,40,0.18), 0 4px 18px rgba(80,60,40,0.09);

      --radius-sm: 6px;
      --radius-md: 10px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --f-ui:      'Jost', 'Inter', sans-serif;
      --f-display: 'Cormorant Garamond', serif;
    }

    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: var(--f-ui);
      background: var(--linen);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Marca / Brand header ─────────────────────── */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 22px 24px 16px;
      background: linear-gradient(180deg, var(--ivory) 0%, var(--cream) 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .brand::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 56px; height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--champagne), transparent);
    }
    .brand img {
      height: 50px;
      filter: drop-shadow(0 2px 5px rgba(80,60,40,0.13));
    }
    .brand h2 {
      font-family: var(--f-display);
      font-size: 30px;
      font-weight: 300;
      letter-spacing: 2px;
      color: var(--text-primary);
      margin: 0;
    }

    /* ── App wrapper ──────────────────────────────── */
    #ms-app-wrapper {
      --c-bg-app:      var(--linen);
      --c-panel:       var(--ivory);
      --c-text:        var(--text-primary);
      --c-border:      var(--border);
      --f-main:        var(--f-ui);
      --f-title:       var(--f-display);

      font-family: var(--f-main);
      background-color: var(--c-bg-app);
      color: var(--c-text);
      width: 100%; height: 100vh;
      display: flex; overflow: hidden;
      position: relative;
      border-top: 1px solid var(--border);
    }
    #ms-app-wrapper * { box-sizing: border-box; }

    /* ── Sidebar ──────────────────────────────────── */
    #ms-app-wrapper .mobile-only-header { display: none; }

    #ms-app-wrapper .studio-sidebar {
      width: 368px; min-width: 368px;
      background: linear-gradient(180deg, var(--ivory) 0%, var(--cream) 100%);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      height: 100%; z-index: 10;
      scrollbar-width: thin;
      scrollbar-color: var(--champagne) transparent;
    }

    #ms-app-wrapper .sidebar-header-area {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(245,240,232,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 5;
    }
    #ms-app-wrapper .sidebar-header-area h2 {
      font-family: var(--f-display);
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin: 0;
      color: var(--text-primary);
    }

    #ms-app-wrapper .sidebar-scroll-area {
      flex: 1; overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--champagne) transparent;
    }
    #ms-app-wrapper .sidebar-scroll-area::-webkit-scrollbar { width: 3px; }
    #ms-app-wrapper .sidebar-scroll-area::-webkit-scrollbar-thumb { background: var(--champagne); border-radius: 4px; }

    /* ── Secciones ────────────────────────────────── */
    #ms-app-wrapper details.am-section {
      border-bottom: 1px solid var(--border);
    }
    #ms-app-wrapper summary.am-summary {
      padding: 14px 24px;
      cursor: pointer; list-style: none;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex; justify-content: space-between; align-items: center;
      transition: color 0.2s;
      user-select: none;
    }
    #ms-app-wrapper summary.am-summary::-webkit-details-marker { display: none; }
    #ms-app-wrapper summary.am-summary::after {
      content: '›';
      font-size: 16px; font-weight: 300;
      transition: transform 0.25s var(--ease);
      color: var(--warm-stone);
    }
    #ms-app-wrapper details.am-section[open] summary.am-summary {
      color: var(--accent-warm);
    }
    #ms-app-wrapper details.am-section[open] summary.am-summary::after {
      transform: rotate(90deg);
    }
    #ms-app-wrapper summary.am-summary:hover { color: var(--accent-warm); }

    #ms-app-wrapper .am-content { padding: 4px 24px 20px 24px; }

    /* ── Labels ───────────────────────────────────── */
    #ms-app-wrapper .section-header {
      font-weight: 600;
      font-size: 9.5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
    }

    /* ── Grids ────────────────────────────────────── */
    #ms-app-wrapper .grid-2,
    #ms-app-wrapper .grid-3,
    #ms-app-wrapper .grid-4 { display: grid; gap: 7px; }
    #ms-app-wrapper .grid-2 { grid-template-columns: 1fr 1fr; }
    #ms-app-wrapper .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    #ms-app-wrapper .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

    /* ── Botones UI ───────────────────────────────── */
    #ms-app-wrapper .btn-ui {
      background: var(--cream);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 10px 4px;
      font-family: var(--f-ui);
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: var(--radius-sm);
      width: 100%;
      transition: all 0.18s var(--ease);
      box-shadow: var(--shadow-xs);
    }
    #ms-app-wrapper .btn-ui:hover {
      background: var(--ivory);
      border-color: var(--border-mid);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }
    #ms-app-wrapper .btn-ui.active {
      background: linear-gradient(135deg, var(--accent-warm), var(--accent-gold));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(184,151,126,0.32);
    }

    /* ── Product grid ─────────────────────────────── */
    #ms-app-wrapper .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    /* ── Inputs / Selects ─────────────────────────── */
    #ms-app-wrapper .am-select,
    #ms-app-wrapper .am-input {
      width: 100%; padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--f-ui);
      font-size: 12px;
      color: var(--text-primary);
      margin-bottom: 6px;
      background: var(--cream);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      box-shadow: var(--shadow-xs);
    }
    #ms-app-wrapper .am-select:focus,
    #ms-app-wrapper .am-input:focus {
      border-color: var(--accent-warm);
      box-shadow: 0 0 0 3px rgba(184,151,126,0.15);
    }
    #ms-app-wrapper .am-input::placeholder { color: var(--text-muted); }

    /* ── Color bar ────────────────────────────────── */
    #ms-app-wrapper .color-bar {
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 7px;
      background: rgba(255,255,255,0.4);
      transition: border-color 0.2s;
    }
    #ms-app-wrapper .color-bar:hover {
      border-color: var(--border-mid);
    }
    #ms-app-wrapper input[type="color"] {
      -webkit-appearance: none; border: none;
      width: 28px; height: 28px; cursor: pointer; background: none;
      border-radius: 50%;
      box-shadow: 0 0 0 1.5px var(--border);
    }

    /* ── Range slider ─────────────────────────────── */
    #ms-app-wrapper input[type="range"] {
      accent-color: var(--accent-warm);
      cursor: pointer;
    }

    /* ── Footer / acciones ────────────────────────── */
    #ms-app-wrapper .sidebar-footer-area {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      background: linear-gradient(180deg, var(--ivory) 0%, var(--linen) 100%);
    }

    #ms-app-wrapper .btn-blue-action {
      background: linear-gradient(135deg, var(--accent-warm) 0%, var(--accent-gold) 100%);
      color: #fff;
      width: 100%;
      padding: 14px 16px;
      font-family: var(--f-ui);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      border-radius: var(--radius-md);
      box-shadow: 0 6px 20px rgba(184,151,126,0.35);
      transition: all 0.2s var(--ease);
    }
    #ms-app-wrapper .btn-blue-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(184,151,126,0.42);
    }
    #ms-app-wrapper .btn-blue-action:active { transform: translateY(0); }

    /* ── Botón agregar diseño oscuro ──────────────── */
    #ms-app-wrapper .btn-blue-action.dark-variant {
      background: linear-gradient(135deg, #4A3F35, #6B5F52) !important;
      box-shadow: 0 5px 16px rgba(74,63,53,0.28) !important;
    }
    #ms-app-wrapper .btn-blue-action.dark-variant:hover {
      box-shadow: 0 9px 24px rgba(74,63,53,0.35) !important;
    }

    /* Botón borrar */
    #ms-app-wrapper #btnDelete {
      font-family: var(--f-ui);
      font-size: 9.5px;
      letter-spacing: 1.5px;
      color: var(--accent-rose) !important;
      border-color: rgba(196,147,138,0.4) !important;
    }

    /* ── Viewport / canvas ────────────────────────── */
    #ms-app-wrapper .studio-viewport {
      flex: 1;
      display: flex; justify-content: center; align-items: center;
      position: relative; overflow: hidden;
      background-color: var(--linen);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(212,201,176,0.28) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(237,213,197,0.22) 0%, transparent 55%),
        radial-gradient(var(--champagne) 0.7px, transparent 0.7px);
      background-size: auto, auto, 22px 22px;
    }
    #ms-app-wrapper .studio-viewport::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(145deg, rgba(250,247,242,0.35) 0%, transparent 45%, rgba(237,213,197,0.18) 100%);
      pointer-events: none;
    }

    #ms-app-wrapper .canvas-scaler {
      box-shadow: var(--shadow-canvas);
      background: #fff;
      transform-origin: center center;
      border-radius: 2px;
      position: relative; z-index: 1;
    }

    /* ── Responsive ───────────────────────────────── */
    @media (max-width: 1100px) {
      #ms-app-wrapper { flex-direction: column !important; height: auto !important; overflow-y: auto !important; display: flex !important; }
      #ms-app-wrapper .mobile-only-header {
        display: block !important; order: 1 !important;
        background: rgba(245,240,232,0.95);
        padding: 15px 24px;
        border-bottom: 1px solid var(--border);
        text-align: center;
      }
      #ms-app-wrapper .mobile-only-header h2 {
        font-family: var(--f-display);
        font-size: 20px; font-weight: 400;
        letter-spacing: 4px; text-transform: uppercase;
        margin: 0; color: var(--text-primary);
      }
      #ms-app-wrapper .studio-viewport { order: 2 !important; width: 100% !important; height: 480px !important; flex: none !important; padding: 10px 0 !important; display: flex !important; align-items: center; justify-content: center; }
      #ms-app-wrapper .studio-sidebar { order: 3 !important; width: 100% !important; min-width: 0 !important; height: auto !important; border-right: none !important; border-top: 1px solid var(--border); }
      #ms-app-wrapper .studio-sidebar .sidebar-header-area { display: none !important; }
      body { overflow: auto !important; }
    }
  </style>
</head>
<body>
<div class="brand">
  <img src="logo.png" alt="Chechena Shirts">
  <h2>Chechena Shirts</h2>
</div>
<div id="ms-app-wrapper">
  <div class="mobile-only-header"><h2>MOCKUP STUDIO</h2></div>
  <div class="studio-sidebar">
    <div class="sidebar-header-area"><h2>MOCKUP STUDIO</h2></div>
    <div class="sidebar-scroll-area">
      <details class="am-section" open>
        <summary class="am-summary">01. Formato y Layout</summary>
        <div class="am-content">
          <span class="section-header">Resolución</span>
          <div class="grid-3" id="format-buttons">
            <button class="btn-ui active" onclick="setFormat(1080, 1080, this)">1:1 POST</button>
            <button class="btn-ui" onclick="setFormat(1080, 1350, this)">4:5 INSTAGRAM POST</button>
            <button class="btn-ui" onclick="setFormat(1080, 1920, this)">9:16 HISTORIA</button>
          </div>
          <span class="section-header" style="margin-top:15px;">Layout de Prendas</span>
          <div class="grid-4" id="group-layout">
            <button class="btn-ui active" onclick="changeLayout('row', this)">FILA</button>
            <button class="btn-ui" onclick="changeLayout('diagonal', this)">DIAG.</button>
            <button class="btn-ui" onclick="changeLayout('col', this)">VERT.</button>
            <button class="btn-ui" onclick="changeLayout('free', this)">LIBRE</button>
          </div>
        </div>
      </details>

      <details class="am-section">
        <summary class="am-summary">02. Mockups y Color</summary>
        <div class="am-content">
          <div class="product-grid" id="product-container"></div>
          <div style="margin-top:15px;">
            <div class="color-bar">
              <span class="section-header" style="margin:0;">Tela</span>
              <input type="color" id="garmentColor" value="#ffffff" oninput="changeGarmentColor(this.value)">
            </div>
            <div class="color-bar">
              <span class="section-header" style="margin:0;">Fondo</span>
              <input type="color" id="bgColor" value="#F5F0E8" oninput="changeBgColor(this.value)">
            </div>
          </div>
        </div>
      </details>

      <details class="am-section">
        <summary class="am-summary">03. Textos y stickers</summary>
        <div class="am-content">
          <span class="section-header">Logo</span>
          <div class="grid-2" style="margin-bottom:12px;">
            <button class="btn-ui" onclick="document.getElementById('logoUpload').click()">Subir Logo</button>
            <button class="btn-ui" onclick="toggleLogoInvert()">Invertir</button>
          </div>
          <input type="file" id="logoUpload" hidden accept="image/*">

          <span class="section-header">Superior</span>
          <div style="display:flex; gap:5px; margin-bottom:6px;">
            <input type="text" id="textTop" class="am-input" style="margin:0;" placeholder="Título..." oninput="updateTexts()">
            <input type="color" id="colorTop" value="#000000" oninput="updateTexts()">
          </div>
          <select id="fontTop" class="am-select scroll-enabled" onchange="updateTexts()"></select>

          <span class="section-header">Subtítulo</span>
          <div style="display:flex; gap:5px; margin-bottom:6px;">
            <input type="text" id="textSub" class="am-input" style="margin:0;" placeholder="Subtítulo..." oninput="updateTexts()">
            <input type="color" id="colorSub" value="#000000" oninput="updateTexts()">
          </div>
          <select id="fontSub" class="am-select scroll-enabled" onchange="updateTexts()"></select>

          <span class="section-header">Inferior</span>
          <div style="display:flex; gap:5px; margin-bottom:6px;">
            <input type="text" id="textBot" class="am-input" style="margin:0;" placeholder="@marca..." oninput="updateTexts()">
            <input type="color" id="colorBot" value="#000000" oninput="updateTexts()">
          </div>
          <select id="fontBot" class="am-select scroll-enabled" onchange="updateTexts()"></select>

          <span class="section-header" style="margin-top:10px;">Stickers (80+)</span>
          <select id="stickerSelect" class="am-select scroll-enabled" onchange="changeSticker(this.value)">
            <option value="">Seleccionar Sticker...</option>
          </select>
        </div>
      </details>

      <details class="am-section">
        <summary class="am-summary">04. Fondo Personalizado</summary>
        <div class="am-content">
          <button class="btn-ui" style="border:1.5px dashed rgba(180,165,145,0.5); margin-bottom:4px;" onclick="document.getElementById('bgUpload').click()">＋ Cargar Fondo</button>
          <input type="file" id="bgUpload" hidden accept="image/*">
          <div style="margin-top:15px;">
            <div style="display:flex; justify-content:space-between;">
              <span class="section-header">Blur</span>
              <span class="section-header" id="blurVal">0%</span>
            </div>
            <input type="range" min="0" max="1" step="0.01" value="0" style="width:100%" oninput="updateBlur(this.value)">
          </div>
        </div>
      </details>

      <details class="am-section" open>
        <summary class="am-summary">05. Diseños Multi-Capa</summary>
        <div class="am-content">
          <button class="btn-blue-action dark-variant" style="font-size:11px; padding:13px; margin-bottom:0;" onclick="document.getElementById('designUpload').click()">＋ Agregar Diseño</button>
          <input type="file" id="designUpload" hidden accept="image/*" multiple>
          <button id="btnDelete" class="btn-ui" style="color:red; margin-top:10px; opacity:0.5;" onclick="deleteSelected()" disabled>BORRAR SELECCIONADO</button>
        </div>
      </details>
    </div>
    <div class="sidebar-footer-area">
      <button class="btn-blue-action" onclick="downloadImage()">DESCARGAR MOCKUP</button>
    </div>
  </div>

  <div class="studio-viewport">
    <div class="canvas-scaler">
      <canvas id="c"></canvas>
    </div>
  </div>
</div>

<script>
  // --- BASES DE DATOS ---
  const PRODUCT_DB = [
    {id:'over_1',name:'OVER 1',front:'https://cdn.shopify.com/s/files/1/0941/6920/3057/files/1_Over_FRENTE.png?v=1768275788',back:'https://cdn.shopify.com/s/files/1/0941/6920/3057/files/1_Over_ESPALDA.png?v=1768275788'},
    {id:'over_2',name:'OVER 2',front:'https://cdn.shopify.com/s/files/1/0941/6920/3057/files/over_2_frente.png?v=1768366829',back:'https://cdn.shopify.com/s/files/1/0941/6920/3057/files/over_2_espalda.png?v=1768366829'},
    {id:'over_3',name:'OVER 3',front:'https://cdn.shopify.com/s/files/1/0941/6920/3057/files/over_3_frente.png?v=1768366913',back:'https://cdn.shopify.com/s/files/1/0941/6920/3057/files/over_3_espalda.png?v=1768366913'},

  const isTouch = window.innerWidth <= 1100;
  fabric.Object.prototype.set({
    transparentCorners: false, cornerColor: '#C9A96E', borderColor: '#B8977E',
    cornerSize: isTouch ? 35 : 14, borderScaleFactor: isTouch ? 5 : 2, padding: isTouch ? 12 : 6, centeredScaling: true
  });

  const canvas = new fabric.Canvas('c', {
    width: 1080, height: 1080, backgroundColor: '#F5F0E8',
    preserveObjectStacking: true, selection: !isTouch
  });

  let fObj, bObj, bgLayer, logoLayer, stickerLayer, tTop, tSub, tBot;
  let shirtColor = '#ffffff', currentLayout = 'row', isLogoInverted = false, stickerTimer = null;

  function initUI() {
    const pCont = document.getElementById('product-container');
    PRODUCT_DB.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = `btn-ui ${i===0?'active':''}`;
      b.innerText = p.name;
      b.onclick = () => {
        pCont.querySelectorAll('.btn-ui').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        changeBaseProduct(p.id);
      };
      pCont.appendChild(b);
    });

    const selects = [document.getElementById('fontTop'), document.getElementById('fontSub'), document.getElementById('fontBot')];
    selects.forEach(s => {
      FONT_DB.forEach(f => s.add(new Option(f, f)));
      s.value = s.id === 'fontTop' ? 'Bebas Neue' : 'Inter';
    });

    const sSel = document.getElementById('stickerSelect');
    RAW_STICKERS.forEach((url, i) => {
      sSel.add(new Option(`Sticker ${i+1}`, `${url}${url.includes('?')?'&':'?'}width=400`));
    });

    document.querySelectorAll('.scroll-enabled').forEach(sel => {
      sel.addEventListener('wheel', e => {
        e.preventDefault();
        if (e.deltaY > 0 && sel.selectedIndex < sel.options.length - 1) sel.selectedIndex++;
        else if (e.deltaY < 0 && sel.selectedIndex > 0) sel.selectedIndex--;
        sel.dispatchEvent(new Event('change'));
        updateTexts();
      });
    });
  }

  function changeBaseProduct(id) {
    const toRem = canvas.getObjects().filter(o => o.isGarment);
    toRem.forEach(o => canvas.remove(o));
    const p = PRODUCT_DB.find(x => x.id === id);
    fabric.Image.fromURL(p.back, (imgB) => {
      bObj = imgB; imgB.isGarment = true; imgB.set({ selectable: false, evented: false });
      applyTint(imgB, shirtColor);
      canvas.insertAt(imgB, 1, false);
      fabric.Image.fromURL(p.front, (imgF) => {
        fObj = imgF; imgF.isGarment = true; imgF.set({ selectable: false, evented: false });
        applyTint(imgF, shirtColor);
        canvas.insertAt(imgF, 2, false);
        applyLayout(true);
      }, { crossOrigin: 'anonymous' });
    }, { crossOrigin: 'anonymous' });
  }

  function applyTint(obj, color) {
    if(!obj) return;
    obj.filters = color !== '#ffffff' ? [new fabric.Image.filters.BlendColor({ color, mode: 'multiply' })] : [];
    obj.applyFilters();
  }

  window.changeGarmentColor = (val) => {
    shirtColor = val;
    applyTint(fObj, val);
    applyTint(bObj, val);
    canvas.renderAll();
  };

  window.changeBgColor = (val) => {
    if(bgLayer) { canvas.remove(bgLayer); bgLayer = null; }
    canvas.setBackgroundColor(val, canvas.renderAll.bind(canvas));
  };

  window.changeLayout = (mode, btn) => {
    currentLayout = mode;
    document.getElementById('group-layout').querySelectorAll('.btn-ui').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyLayout(true);
  };

  function applyLayout(animate = false) {
    if(!fObj || !bObj) return;
    const W = canvas.width, H = canvas.height, isFree = currentLayout === 'free';
    fObj.set({ selectable: isFree, evented: isFree });
    bObj.set({ selectable: isFree, evented: isFree });
    if(isFree && !animate) return;
    let sc = 0.46, posF = {x:0.27, y:0.5}, posB = {x:0.73, y:0.5};
    if(currentLayout === 'diagonal') { sc = 0.48; posF = {x:0.3, y:0.42}; posB = {x:0.7, y:0.58}; }
    else if(currentLayout === 'col') { sc = 0.52; posF = {x:0.5, y:0.28}; posB = {x:0.5, y:0.72}; }
    const s = (W * sc) / fObj.width;
    const conf = { onChange: canvas.renderAll.bind(canvas), duration: 300 };
    fObj.animate({ left: W*posF.x, top: H*posF.y, scaleX: s, scaleY: s }, conf);
    bObj.animate({ left: W*posB.x, top: H*posB.y, scaleX: s, scaleY: s }, conf);
    fObj.set({ originX:'center', originY:'center' });
    bObj.set({ originX:'center', originY:'center' });
    syncResolution();
  }

  function syncResolution() {
    const W = canvas.width, H = canvas.height;
    if(bgLayer) {
      const scale = Math.max(W/bgLayer._element.width, H/bgLayer._element.height) * 1.01;
      bgLayer.set({ scaleX: scale, scaleY: scale, left: W/2, top: H/2 });
      bgLayer.setCoords();
    }
    if(logoLayer) { logoLayer.set({ left: W * 0.95, top: H * 0.95 }); logoLayer.bringToFront(); }
    if(stickerLayer) { stickerLayer.set({ left: W * 0.05, top: H * 0.95, originX: 'left', originY: 'bottom' }); stickerLayer.bringToFront(); }
    updateTexts();
    canvas.getObjects().forEach(o => { if(!o.isGarment && o !== bgLayer) o.bringToFront(); });
  }

  async function updateTexts() {
    const W = canvas.width, H = canvas.height;
    const data = [
      {id:'textTop', font:'fontTop', layer:'tTop', y:0.08, sz:0.07, col:'colorTop'},
      {id:'textSub', font:'fontSub', layer:'tSub', y:0.04, sz:0.03, col:'colorSub'},
      {id:'textBot', font:'fontBot', layer:'tBot', y:0.90, sz:0.04, col:'colorBot'}
    ];
    for(let d of data) {
      const val = document.getElementById(d.id).value;
      const fnt = document.getElementById(d.font).value;
      const cVal = document.getElementById(d.col).value;
      if(!val) {
        if(window[d.layer]) { canvas.remove(window[d.layer]); window[d.layer]=null; }
        continue;
      }
      try {
        await new FontFaceObserver(fnt).load(null, 5000);
        if(!window[d.layer]) {
          window[d.layer] = new fabric.Text('', { originX:'center', selectable: false, evented: false });
          canvas.add(window[d.layer]);
        }
        window[d.layer].set({ text: val.toUpperCase(), fontFamily: fnt, fontSize: W * d.sz, left: W/2, top: H * d.y, fill: cVal });
        window[d.layer].bringToFront();
      } catch(e) {
        if(!window[d.layer]) {
          window[d.layer] = new fabric.Text('', { originX:'center', selectable: false, evented: false });
          canvas.add(window[d.layer]);
        }
        window[d.layer].set({ text: val.toUpperCase(), fontFamily: 'sans-serif', fontSize: W * d.sz, left: W/2, top: H * d.y, fill: cVal });
      }
    }
    canvas.renderAll();
  }

  function changeSticker(url) {
    if(stickerTimer) clearTimeout(stickerTimer);
    if(stickerLayer) { canvas.remove(stickerLayer); stickerLayer = null; }
    if(!url) return;
    stickerTimer = setTimeout(() => {
      fabric.Image.fromURL(url, (img) => {
        stickerLayer = img;
        img.scaleToWidth(canvas.width * 0.16);
        img.set({ left: canvas.width * 0.05, top: canvas.height * 0.95, originX: 'left', originY: 'bottom', selectable: true });
        canvas.add(img); img.bringToFront(); canvas.renderAll();
      }, { crossOrigin: 'anonymous' });
    }, 500);
  }

  document.getElementById('logoUpload').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      fabric.Image.fromURL(ev.target.result, (img) => {
        if(logoLayer) canvas.remove(logoLayer);
        logoLayer = img;
        img.scaleToWidth(canvas.width * 0.15);
        img.set({ left: canvas.width * 0.95, top: canvas.height * 0.95, originX: 'right', originY: 'bottom', selectable: true });
        canvas.add(img); applyLogoFilters(); img.bringToFront();
      });
    };
    reader.readAsDataURL(f);
  });

  function applyLogoFilters() {
    if(!logoLayer) return;
    logoLayer.filters = isLogoInverted ? [new fabric.Image.filters.Invert()] : [];
    logoLayer.applyFilters();
    canvas.renderAll();
  }

  function toggleLogoInvert() {
    isLogoInverted = !isLogoInverted;
    applyLogoFilters();
  }

  document.getElementById('designUpload').addEventListener('change', function(e) {
    const files = Array.from(e.target.files);
    files.forEach(f => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        fabric.Image.fromURL(ev.target.result, (img) => {
          img.scaleToWidth(canvas.width * 0.3);
          img.set({ left: canvas.width/2, top: canvas.height/2, originX: 'center', originY: 'center' });
          canvas.add(img); img.bringToFront(); canvas.setActiveObject(img);
        });
      };
      reader.readAsDataURL(f);
    });
    e.target.value = '';
  });

  document.getElementById('bgUpload').addEventListener('change', function(e) {
    const f = e.target.files[0];
    const reader = new FileReader();
    reader.onload = (ev) => {
      fabric.Image.fromURL(ev.target.result, (img) => {
        if(bgLayer) canvas.remove(bgLayer);
        bgLayer = img;
        img.set({ originX: 'center', originY: 'center', selectable: false, evented: false, lockMovementX: true, lockMovementY: true, objectCaching: false });
        canvas.insertAt(img, 0, false);
        syncResolution();
      });
    };
    reader.readAsDataURL(f);
  });

  window.updateBlur = (val) => {
    document.getElementById('blurVal').innerText = Math.round(val*100) + '%';
    if(bgLayer) {
      bgLayer.set({ objectCaching: false });
      bgLayer.filters = val > 0 ? [new fabric.Image.filters.Blur({ blur: val })] : [];
      bgLayer.applyFilters();
      bgLayer.setCoords();
      canvas.requestRenderAll();
    }
  };

  window.setFormat = (w, h, btn) => {
    document.getElementById('format-buttons').querySelectorAll('.btn-ui').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    canvas.setDimensions({ width: w, height: h });
    syncResolution();
    applyLayout(true);
    resizeCanvasToFit();
  };

  function resizeCanvasToFit() {
    const vp = document.querySelector('.studio-viewport');
    const sc = Math.min((vp.clientWidth-40)/canvas.width, (vp.clientHeight-40)/canvas.height);
    document.querySelector('.canvas-scaler').style.transform = `scale(${sc})`;
  }

  window.downloadImage = () => {
    canvas.discardActiveObject();
    canvas.renderAll();
    const link = document.createElement('a');
    link.download = 'MOCKUP_MANUAL.png';
    link.href = canvas.toDataURL({ format: 'png', multiplier: 1 });
    link.click();
  };

  window.deleteSelected = () => {
    const act = canvas.getActiveObject();
    if(act && !act.isGarment && act !== bgLayer) {
      canvas.remove(act);
      canvas.discardActiveObject();
    }
  };

  canvas.on('selection:created', () => {
    document.getElementById('btnDelete').disabled = false;
    document.getElementById('btnDelete').style.opacity = 1;
  });
  canvas.on('selection:cleared', () => {
    document.getElementById('btnDelete').disabled = true;
    document.getElementById('btnDelete').style.opacity = 0.5;
  });

  window.addEventListener('resize', resizeCanvasToFit);
  window.onload = () => {
    initUI();
    changeBaseProduct(PRODUCT_DB[0].id);
    setTimeout(resizeCanvasToFit, 200);
  };
</script>
</body>
</html>
